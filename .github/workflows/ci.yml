name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm link
      - run: npm run check
      - name: Install process sandbox support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) { userns, }\n' | sudo tee /etc/apparmor.d/bwrap
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
      - run: npm test
      - run: seeda --help && seeda --version
